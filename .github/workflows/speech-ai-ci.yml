name: speech-ai-ci

on:
  push:
    paths:
      - "speech-ai/**"
      - "contracts/patient-event.schema.json"
      - "infra/docker/speech-ai.Dockerfile"
      - ".github/workflows/speech-ai-ci.yml"
  pull_request:
    paths:
      - "speech-ai/**"
      - "contracts/patient-event.schema.json"
      - "infra/docker/speech-ai.Dockerfile"
      - ".github/workflows/speech-ai-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e "speech-ai[dev]"
      - run: python -m pytest speech-ai/tests
      - run: python -m ruff check speech-ai
      - run: python -m mypy speech-ai/app
      - run: docker build -f infra/docker/speech-ai.Dockerfile .
