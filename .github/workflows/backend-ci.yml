name: backend-ci

on:
  push:
    paths: ["backend/**", "contracts/**", "infra/docker/backend.Dockerfile", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "contracts/**", "infra/docker/backend.Dockerfile", ".github/workflows/backend-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chungbuk_emergency_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chungbuk_emergency_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/chungbuk_emergency_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "backend[dev]"
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: python -m alembic check
        working-directory: backend
      - run: python -m pytest backend/tests
      - run: python -m ruff check backend
      - run: python -m mypy backend/app
      - run: docker build -f infra/docker/backend.Dockerfile .
