name: frontend-ci

on:
  push:
    paths: ["frontend/**", "infra/docker/frontend.Dockerfile", "infra/docker/nginx.conf", ".github/workflows/frontend-ci.yml"]
  pull_request:
    paths: ["frontend/**", "infra/docker/frontend.Dockerfile", "infra/docker/nginx.conf", ".github/workflows/frontend-ci.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - run: npm audit --omit=dev
      - run: docker build -f infra/docker/frontend.Dockerfile --target production .
        working-directory: ${{ github.workspace }}
