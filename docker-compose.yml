services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chungbuk_emergency
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chungbuk_emergency"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    working_dir: /workspace/backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/chungbuk_emergency
      NAVER_MAP_CLIENT_ID: ${NAVER_MAP_CLIENT_ID:-}
      NAVER_MAP_CLIENT_SECRET: ${NAVER_MAP_CLIENT_SECRET:-}
      NAVER_DIRECTIONS_MAX_CALLS: ${NAVER_DIRECTIONS_MAX_CALLS:-30}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/workspace/backend
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    working_dir: /workspace/frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_NAVER_MAP_CLIENT_ID: ${VITE_NAVER_MAP_CLIENT_ID:-}
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/workspace/frontend
      - frontend_node_modules:/workspace/frontend/node_modules
    depends_on:
      - backend

  speech-ai:
    profiles: ["speech"]
    build:
      context: .
      dockerfile: infra/docker/speech-ai.Dockerfile
    working_dir: /workspace/speech-ai
    command: python -m app.main
    volumes:
      - ./speech-ai:/workspace/speech-ai

volumes:
  postgres_data:
  frontend_node_modules:
