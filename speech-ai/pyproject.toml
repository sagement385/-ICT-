[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chungbuk-emergency-speech-ai"
version = "0.1.0"
description = "Speech-to-patient-event interface skeleton"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
